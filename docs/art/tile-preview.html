<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tile styles</title>
<style>
  body { margin: 0; background: #14161f; color: #e8dcb8; font: 15px Georgia, serif; }
  .panel { padding: 14px 16px 22px; }
  h2 { margin: 0 0 8px; font-weight: normal; color: #f0c040; }
  svg { display: block; width: 100%; height: auto; }
  #ink, #ink2, #ink3 { background: #efe6cf; }
</style>
</head>
<body>
<div class="panel" id="p-current"><h2>A · Current</h2><svg id="current"></svg></div>
<div class="panel" id="p-painted"><h2>B · Painted</h2><svg id="painted"></svg></div>
<div class="panel" id="p-ink"><h2>C · Ink wash</h2><svg id="ink"></svg></div>
<div class="panel" id="p-ink2"><h2>C2 · Ink wash, organic</h2><svg id="ink2"></svg></div>
<div class="panel" id="p-units"><h2>Unit figures</h2><svg id="units"></svg></div>
<div class="panel" id="p-ink3"><h2>C3 · Ink wash with figures</h2><svg id="ink3"></svg></div>
<div class="panel" id="p-pixel"><h2>D · 16-bit</h2><svg id="pixel"></svg></div>
<script type="module">
const field = await (await fetch('field.json')).json();
const W_ = 15, H_ = 11, R = 30, SQ3 = Math.sqrt(3), PAD = 6;
const W = R * SQ3 * (W_ + 0.5) + PAD * 2, H = R * 1.5 * (H_ - 1) + R * 2 + PAD * 2;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, ...kids) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); for (const k of kids) e.append(k); return e; };
const center = (c, r) => [R * SQ3 * (c + 0.5 * (r & 1)) + (R * SQ3) / 2 + PAD, R * 1.5 * r + R + PAD];
const hexPts = (c, r, s = 1) => { const [x, y] = center(c, r); const p = []; for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 6; p.push(`${(x + R * s * Math.cos(a)).toFixed(1)},${(y + R * s * Math.sin(a)).toFixed(1)}`); } return p.join(' '); };
// Seeded per-hex randomness so every redraw looks the same.
const rng = (c, r, k = 0) => { let s = (c * 73856093) ^ (r * 19349663) ^ (k * 83492791); return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };
const at = (c, r) => field.terrain[r * W_ + c];
const site = (c, r) => field.sites[r * W_ + c];
const hexes = []; for (let r = 0; r < H_; r++) for (let c = 0; c < W_; c++) hexes.push({ c, r, t: at(c, r), s: site(c, r) });
// Points scattered inside a hex (kept clear of the edges).
const scatter = (c, r, n, rad = 0.62, k = 1) => { const g = rng(c, r, k); const [x, y] = center(c, r); const out = []; for (let i = 0; i < n; i++) { const a = g() * Math.PI * 2, d = Math.sqrt(g()) * R * rad; out.push([x + Math.cos(a) * d, y + Math.sin(a) * d * 0.9, g()]); } return out.sort((a, b) => a[1] - b[1]); };

function setup(id) { const svg = document.getElementById(id); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); return svg; }

// ---------------------------------------------------------------- A · current
{
  const svg = setup('current');
  const COL = { plains: '#b9c77e', forest: '#5f8a45', hills: '#b3a066', mountain: '#877764', marsh: '#7c9f94', river: '#4a7fc0', ford: '#86b3dd', castle: '#a39079' };
  const GL = { forest: '♣', hills: '⌒', mountain: '▲', marsh: '≈', castle: '♜', ford: '≈' };
  const SITE = { farm: ['#d6c35a', '⁂'], market: ['#c9a27a', '⌂'] };
  for (const { c, r, t, s } of hexes) {
    const [x, y] = center(c, r);
    svg.append(el('polygon', { points: hexPts(c, r), fill: s && t !== 'castle' ? SITE[s][0] : COL[t], stroke: '#00000030', 'stroke-width': 1 }));
    const g = s && t !== 'castle' ? SITE[s][1] : GL[t];
    if (g) { const tx = el('text', { x, y: y + 6, 'text-anchor': 'middle', 'font-size': 16, fill: '#0000005a' }); tx.textContent = g; svg.append(tx); }
  }
  for (const u of field.units) {
    const [x, y] = center(u.c, u.r);
    svg.append(el('circle', { cx: x, cy: y, r: 20, fill: u.side === 'att' ? '#2a5db0' : '#9aa7b3', stroke: '#111', 'stroke-width': 2 }));
    const tx = el('text', { x, y: y + 7, 'text-anchor': 'middle', 'font-size': 18, fill: '#fff' }); tx.textContent = { cav: '♞', inf: '⚔', arc: '➶' }[u.type]; svg.append(tx);
  }
}

// ---------------------------------------------------------------- B · painted
{
  const svg = setup('painted');
  const defs = el('defs'); svg.append(defs);
  const BASE = { plains: ['#b8d27a', '#93b25a'], forest: ['#7fa95a', '#5c8a40'], hills: ['#d6c08a', '#b49a62'], mountain: ['#a5978a', '#7d6f63'], marsh: ['#93b3a2', '#6f9483'], river: ['#5e9bd6', '#3c74b4'], ford: ['#a9cdea', '#7fb0db'], castle: ['#cbb895', '#a8946f'] };
  for (const [t, [a, b]] of Object.entries(BASE)) {
    defs.append(el('radialGradient', { id: `pg-${t}`, cx: '45%', cy: '40%', r: '70%' }, el('stop', { offset: '0%', 'stop-color': a }), el('stop', { offset: '100%', 'stop-color': b })));
  }
  defs.append(el('pattern', { id: 'furrows', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(-30)' },
    el('rect', { width: 6, height: 6, fill: '#e2c860' }), el('rect', { width: 6, height: 2, fill: '#c9a83e' })));
  defs.append(el('filter', { id: 'shadow', x: '-30%', y: '-30%', width: '160%', height: '160%' }, el('feDropShadow', { dx: 1.5, dy: 2, stdDeviation: 1.2, 'flood-opacity': 0.45 })));
  const layer = el('g'); const deco = el('g'); const top = el('g'); svg.append(layer, deco, top);
  const tree = (x, y, s, g) => {
    deco.append(el('ellipse', { cx: x + 2, cy: y + 7 * s, rx: 7 * s, ry: 2.5 * s, fill: '#00000030' }));
    deco.append(el('rect', { x: x - 1.2 * s, y: y + 2 * s, width: 2.4 * s, height: 5 * s, fill: '#6b4a2b' }));
    deco.append(el('circle', { cx: x, cy: y, r: 6.5 * s, fill: g() > 0.5 ? '#3f7a34' : '#467f38' }));
    deco.append(el('circle', { cx: x + 2 * s, cy: y + 1.5 * s, r: 4.5 * s, fill: '#2f6128' }));
    deco.append(el('circle', { cx: x - 2 * s, cy: y - 2 * s, r: 2.6 * s, fill: '#79b25c' }));
  };
  for (const { c, r, t, s } of hexes) {
    const [x, y] = center(c, r); const g = rng(c, r, 7);
    layer.append(el('polygon', { points: hexPts(c, r), fill: `url(#pg-${t})`, stroke: '#0000001f', 'stroke-width': 1 }));
    if (s === 'farm' && t !== 'castle') {
      layer.append(el('polygon', { points: hexPts(c, r, 0.86), fill: 'url(#furrows)', stroke: '#a88a2e', 'stroke-width': 1.2 }));
      continue;
    }
    if (t === 'plains') for (const [px, py] of scatter(c, r, 5, 0.65, 2)) deco.append(el('path', { d: `M${px - 3},${py} l2,-5 l1,4 l2,-6 l1,7`, fill: 'none', stroke: '#6f9440', 'stroke-width': 1.2, 'stroke-linecap': 'round' }));
    if (t === 'forest') for (const [px, py, k] of scatter(c, r, 4, 0.5, 3)) tree(px, py, 0.9 + k * 0.4, g);
    if (t === 'hills') for (const [px, py, k] of scatter(c, r, 2, 0.35, 4)) {
      const w = 13 + k * 5;
      deco.append(el('path', { d: `M${px - w},${py + 6} Q${px},${py - 14} ${px + w},${py + 6} Z`, fill: '#c9ad6f' }));
      deco.append(el('path', { d: `M${px},${py - 4} Q${px + w * 0.6},${py - 2} ${px + w},${py + 6} L${px},${py + 6} Z`, fill: '#a58a52' }));
      deco.append(el('path', { d: `M${px - w},${py + 6} Q${px},${py - 14} ${px + w},${py + 6}`, fill: 'none', stroke: '#7d6638', 'stroke-width': 1.2 }));
    }
    if (t === 'mountain') {
      const peak = (px, py, h, wv) => {
        deco.append(el('polygon', { points: `${px - wv},${py + h * 0.45} ${px},${py - h * 0.55} ${px + wv},${py + h * 0.45}`, fill: '#8d7f72', filter: 'url(#shadow)' }));
        deco.append(el('polygon', { points: `${px},${py - h * 0.55} ${px + wv},${py + h * 0.45} ${px + wv * 0.15},${py + h * 0.45}`, fill: '#5f5248' }));
        deco.append(el('polygon', { points: `${px - wv * 0.32},${py - h * 0.18} ${px},${py - h * 0.55} ${px + wv * 0.3},${py - h * 0.2} ${px + wv * 0.08},${py - h * 0.12}`, fill: '#f4f1ea' }));
      };
      peak(x + 7, y + 4, 22, 11); peak(x - 6, y + 1, 30, 14);
    }
    if (t === 'river' || t === 'ford') {
      for (let i = 0; i < 3; i++) { const yy = y - 10 + i * 9 + g() * 3; deco.append(el('path', { d: `M${x - 18},${yy} q4.5,-4 9,0 t9,0 t9,0 t9,0`, fill: 'none', stroke: '#ffffff', 'stroke-opacity': t === 'ford' ? 0.45 : 0.35, 'stroke-width': 1.3 })); }
      if (t === 'ford') for (const [px, py] of scatter(c, r, 5, 0.6, 5)) deco.append(el('ellipse', { cx: px, cy: py, rx: 3.2, ry: 2.2, fill: '#c9c3b5', stroke: '#8b8578', 'stroke-width': 0.8 }));
    }
    if (t === 'marsh') {
      for (const [px, py] of scatter(c, r, 3, 0.55, 6)) deco.append(el('ellipse', { cx: px, cy: py, rx: 7, ry: 2.6, fill: '#5d8aa0', 'fill-opacity': 0.55 }));
      for (const [px, py] of scatter(c, r, 6, 0.65, 8)) { deco.append(el('path', { d: `M${px},${py} l-1.5,-8 M${px + 2},${py} l1,-9 M${px + 4},${py} l2.5,-7`, stroke: '#3f6b48', 'stroke-width': 1.1, 'stroke-linecap': 'round' })); deco.append(el('ellipse', { cx: px + 2, cy: py - 9, rx: 1, ry: 2.2, fill: '#6b4a2b' })); }
    }
    if (s === 'market' && t !== 'castle') {
      layer.append(el('polygon', { points: hexPts(c, r, 0.86), fill: '#d9b98a', stroke: '#a3855a', 'stroke-width': 1.2 }));
      for (const [px, py] of [[x - 8, y + 2], [x + 7, y - 4]]) {
        deco.append(el('rect', { x: px - 6, y: py - 1, width: 12, height: 8, fill: '#8b5a34', filter: 'url(#shadow)' }));
        deco.append(el('polygon', { points: `${px - 9},${py} ${px},${py - 7} ${px + 9},${py}`, fill: '#b8432f' }));
        deco.append(el('rect', { x: px - 2, y: py + 2, width: 4, height: 5, fill: '#3b2416' }));
      }
    }
    if (t === 'castle') {
      deco.append(el('polygon', { points: hexPts(c, r, 0.78), fill: '#9c8a6c', stroke: '#5f4e37', 'stroke-width': 3.5, filter: 'url(#shadow)' }));
      for (let i = 0; i < 6; i += 2) { const a = Math.PI / 3 * i - Math.PI / 6; const tx = x + R * 0.78 * Math.cos(a), ty = y + R * 0.78 * Math.sin(a); deco.append(el('rect', { x: tx - 4, y: ty - 4, width: 8, height: 8, fill: '#7a6748', stroke: '#4a3c28' })); }
      deco.append(el('rect', { x: x - 8, y: y - 4, width: 16, height: 11, fill: '#d8ccb2', stroke: '#5f4e37' }));
      deco.append(el('path', { d: `M${x - 12},${y - 3} L${x},${y - 12} L${x + 12},${y - 3} Z`, fill: '#a33a2a', stroke: '#6e2219' }));
    }
  }
  for (const u of field.units) {
    const [x, y] = center(u.c, u.r); const col = u.side === 'att' ? ['#3a6fd0', '#1d3f80'] : ['#c4553f', '#7a2a1d'];
    top.append(el('circle', { cx: x, cy: y + 1, r: 17, fill: col[0], stroke: col[1], 'stroke-width': 3, filter: 'url(#shadow)' }));
    top.append(el('circle', { cx: x, cy: y + 1, r: 13, fill: 'none', stroke: '#ffffff60', 'stroke-width': 1 }));
    const tx = el('text', { x, y: y + 7.5, 'text-anchor': 'middle', 'font-size': 17, fill: '#fff', 'font-weight': 'bold' }); tx.textContent = { cav: '♞', inf: '⚔', arc: '➶' }[u.type]; top.append(tx);
    if (u.cmd) { top.append(el('line', { x1: x + 13, y1: y - 10, x2: x + 13, y2: y - 30, stroke: '#3b2a1a', 'stroke-width': 2 })); top.append(el('path', { d: `M${x + 13},${y - 30} l12,4 l-12,4 Z`, fill: col[0], stroke: col[1] })); }
  }
}

// ---------------------------------------------------------------- C · ink wash
{
  const svg = setup('ink');
  const defs = el('defs'); svg.append(defs);
  defs.append(el('filter', { id: 'paper', x: 0, y: 0, width: '100%', height: '100%' },
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: 0.8, numOctaves: 3, seed: 3 }),
    el('feColorMatrix', { values: '0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.25  0 0 0 0.09 0' })));
  defs.append(el('filter', { id: 'wash', x: '-20%', y: '-20%', width: '140%', height: '140%' },
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: 0.06, numOctaves: 2, seed: 9, result: 'n' }),
    el('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale: 9, xChannelSelector: 'R', yChannelSelector: 'G', result: 'd' }),
    el('feGaussianBlur', { in: 'd', stdDeviation: 1.6 })));
  defs.append(el('filter', { id: 'brush', x: '-20%', y: '-20%', width: '140%', height: '140%' },
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: 0.5, numOctaves: 1, seed: 4, result: 'n' }),
    el('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale: 2.5 })));
  defs.append(el('linearGradient', { id: 'mtn', x1: 0, y1: 0, x2: 0, y2: 1 }, el('stop', { offset: '0%', 'stop-color': '#2b2a27', 'stop-opacity': 0.9 }), el('stop', { offset: '100%', 'stop-color': '#2b2a27', 'stop-opacity': 0 })));
  svg.append(el('rect', { width: W, height: H, fill: '#efe6cf' }));
  const wash = el('g', { filter: 'url(#wash)' }); const ink = el('g', { filter: 'url(#brush)' }); const top = el('g'); svg.append(wash, ink);
  const WASH = { plains: null, forest: '#6d8a63', hills: '#a48d62', mountain: '#7d7a73', marsh: '#7d9a92', river: '#6f8fa6', ford: '#9db3c2', castle: '#a39a8a' };
  for (const { c, r, t, s } of hexes) {
    const [x, y] = center(c, r); const g = rng(c, r, 11);
    const col = s === 'farm' && t !== 'castle' ? '#d8b866' : s === 'market' && t !== 'castle' ? '#c7a27e' : WASH[t];
    if (col) wash.append(el('polygon', { points: hexPts(c, r, 1.05), fill: col, 'fill-opacity': t === 'river' ? 0.55 : 0.35 }));
    if (t === 'forest') for (const [px, py, k] of scatter(c, r, 5, 0.55, 3)) { ink.append(el('ellipse', { cx: px, cy: py, rx: 5 + k * 3, ry: 4 + k * 2.5, fill: '#24331f', 'fill-opacity': 0.55 + k * 0.3 })); ink.append(el('path', { d: `M${px},${py + 3} l0,6`, stroke: '#24331f', 'stroke-width': 1.3 })); }
    if (t === 'mountain') {
      const peak = (px, py, h, wv) => { ink.append(el('path', { d: `M${px - wv},${py + h / 2} C${px - wv * 0.4},${py - h * 0.1} ${px - wv * 0.2},${py - h / 2} ${px},${py - h / 2} C${px + wv * 0.25},${py - h * 0.3} ${px + wv * 0.5},${py} ${px + wv},${py + h / 2} Z`, fill: 'url(#mtn)' })); ink.append(el('path', { d: `M${px - wv},${py + h / 2} C${px - wv * 0.4},${py - h * 0.1} ${px - wv * 0.2},${py - h / 2} ${px},${py - h / 2} C${px + wv * 0.25},${py - h * 0.3} ${px + wv * 0.5},${py} ${px + wv},${py + h / 2}`, fill: 'none', stroke: '#1d1c1a', 'stroke-width': 1.8 })); };
      peak(x - 6, y + 2, 34, 15); peak(x + 9, y + 7, 22, 10);
    }
    if (t === 'hills') for (const [px, py] of scatter(c, r, 2, 0.35, 4)) ink.append(el('path', { d: `M${px - 14},${py + 5} Q${px},${py - 11} ${px + 14},${py + 5}`, fill: 'none', stroke: '#3d342a', 'stroke-width': 2, 'stroke-linecap': 'round' }));
    if (t === 'river' || t === 'ford') for (let i = 0; i < 2; i++) { const yy = y - 6 + i * 11 + g() * 3; ink.append(el('path', { d: `M${x - 17},${yy} q6,-4 12,0 t12,0 t12,0`, fill: 'none', stroke: '#3e5566', 'stroke-width': 1.2, 'stroke-opacity': 0.75 })); }
    if (t === 'marsh') for (const [px, py] of scatter(c, r, 6, 0.6, 8)) ink.append(el('path', { d: `M${px},${py} q-1,-6 -3,-10 M${px + 2},${py} q1,-6 0,-11`, fill: 'none', stroke: '#2c3a2c', 'stroke-width': 1.1 }));
    if (t === 'plains' && !s) for (const [px, py] of scatter(c, r, 2, 0.6, 2)) ink.append(el('path', { d: `M${px - 3},${py} q2,-4 3,-1 q1,-4 3,0`, fill: 'none', stroke: '#6a6150', 'stroke-width': 0.9, 'stroke-opacity': 0.7 }));
    if (s === 'farm' && t !== 'castle') for (let i = -2; i <= 2; i++) ink.append(el('path', { d: `M${x - 15},${y + i * 6 + 4} L${x + 15},${y + i * 6 - 4}`, stroke: '#7a5f24', 'stroke-width': 0.9, 'stroke-opacity': 0.8 }));
    if (s === 'market' && t !== 'castle') for (const [px, py] of [[x - 8, y + 3], [x + 7, y - 3]]) { ink.append(el('path', { d: `M${px - 9},${py} Q${px},${py - 9} ${px + 9},${py}`, fill: '#b23b28', stroke: '#2a1a12', 'stroke-width': 1 })); ink.append(el('path', { d: `M${px - 6},${py} l0,6 M${px + 6},${py} l0,6`, stroke: '#2a1a12', 'stroke-width': 1.2 })); }
    if (t === 'castle') {
      ink.append(el('polygon', { points: hexPts(c, r, 0.78), fill: 'none', stroke: '#2a2622', 'stroke-width': 3 }));
      ink.append(el('rect', { x: x - 9, y: y - 3, width: 18, height: 11, fill: '#e9e0c8', stroke: '#2a2622', 'stroke-width': 1.4 }));
      ink.append(el('path', { d: `M${x - 15},${y - 2} Q${x},${y - 6} ${x - 2},${y - 14} Q${x},${y - 6} ${x + 15},${y - 2} Z`, fill: '#b23b28', stroke: '#2a1a12', 'stroke-width': 1.2 }));
    }
    svg.append(el('polygon', { points: hexPts(c, r), fill: 'none', stroke: '#5a4e3a', 'stroke-opacity': 0.12, 'stroke-width': 1 }));
  }
  svg.append(el('rect', { width: W, height: H, filter: 'url(#paper)', 'pointer-events': 'none' }));
  svg.append(top);
  for (const u of field.units) {
    const [x, y] = center(u.c, u.r);
    const seal = u.side === 'def';
    top.append(el('rect', { x: x - 15, y: y - 15, width: 30, height: 30, rx: 3, fill: seal ? '#b23b28' : '#f5efe0', stroke: seal ? '#7a2116' : '#1d1c1a', 'stroke-width': 2.5, filter: 'url(#brush)' }));
    const tx = el('text', { x, y: y + 8, 'text-anchor': 'middle', 'font-size': 21, fill: seal ? '#f5efe0' : '#1d1c1a', 'font-family': '"Noto Serif CJK SC", "Songti SC", "SimSun", serif' }); tx.textContent = { cav: '騎', inf: '步', arc: '弓' }[u.type]; top.append(tx);
    if (u.cmd) top.append(el('circle', { cx: x + 14, cy: y - 14, r: 4.5, fill: seal ? '#1d1c1a' : '#b23b28' }));
  }
}


// ---------------------------------------------------------------- C2 · organic ink wash
{
  const svg = setup('ink2');
  const defs = el('defs'); svg.append(defs);
  const filt = (id, freq, scale, blur, seed) => defs.append(el('filter', { id, x: '-30%', y: '-30%', width: '160%', height: '160%' },
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: freq, numOctaves: 3, seed, result: 'n' }),
    el('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale, xChannelSelector: 'R', yChannelSelector: 'G', result: 'd' }),
    el('feGaussianBlur', { in: 'd', stdDeviation: blur })));
  filt('pool', 0.035, 26, 3.2, 5);     // soft watercolour pools
  filt('bleed', 0.09, 10, 0.9, 8);     // ink that bleeds a little
  filt('dry', 0.6, 3, 0.15, 2);        // dry brush edges
  defs.append(el('filter', { id: 'paper2', x: 0, y: 0, width: '100%', height: '100%' },
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.9 0.25', numOctaves: 4, seed: 12 }),
    el('feColorMatrix', { values: '0 0 0 0 0.42  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.11 0' })));
  defs.append(el('radialGradient', { id: 'vignette', cx: '50%', cy: '50%', r: '75%' }, el('stop', { offset: '60%', 'stop-color': '#7a6340', 'stop-opacity': 0 }), el('stop', { offset: '100%', 'stop-color': '#7a6340', 'stop-opacity': 0.28 })));

  pat('px-forest', '#3c8c34', [[1, 1, '#2c6c28'], [3, 3, '#2c6c28'], [0, 2, '#4ca040']]);
  pat('px-hills', '#c8a868', [[0, 1, '#d8bc80'], [2, 3, '#b09050']]);
  pat('px-mountain', '#98887c', [[1, 0, '#b0a090'], [3, 2, '#786a60']]);
  pat('px-marsh', '#689c80', [[0, 0, '#4c8070'], [2, 2, '#4c8070'], [1, 3, '#80b090']]);
  pat('px-river', '#3070d0', [[0, 1, '#5090e8'], [1, 1, '#5090e8'], [3, 3, '#2058b0']]);
  pat('px-ford', '#70a8e0', [[0, 1, '#98c8f0'], [2, 3, '#5890d0']]);
  pat('px-castle', '#a89880', [[0, 0, '#8c7c64'], [2, 2, '#8c7c64']]);
  pat('px-farm', '#d8c040', [[0, 0, '#b89c28'], [1, 0, '#b89c28'], [2, 0, '#b89c28'], [3, 0, '#b89c28'], [0, 2, '#e8d868']]);
  pat('px-market', '#d0a878', [[0, 0, '#b88c58'], [2, 2, '#b88c58']]);
  // Sprites drawn on a pixel grid: strings of rows, '.' = transparent.
  const sprite = (rows, pal, x, y, layer) => rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') layer.append(el('rect', { x: Math.round(x + i * P), y: Math.round(y + j * P), width: P, height: P, fill: pal[ch] })); }));
  const TREE = ['..gg..', '.gGGg.', 'gGGGgg', 'gGgggg', '.gggg.', '..tt..'];
  const PEAK = ['....w....', '...wwd...', '..mwmdd..', '.mmmmddd.', 'mmmmmdddd'];
  const HILL = ['..hhhh..', '.hHHhhb.', 'hHHhhhbb'];
  const REED = ['r.r', 'r.r', '.r.'];
  const WAVE = ['w.w.', '.w.w'];
  const STALL = ['.RRRR.', 'RRRRRR', '.b..b.', '.bxxb.'];
  const KEEP = ['...RR...', '..RRRR..', '.RRRRRR.', '..wwww..', '..wddw..', '..wddw..'];
  const layer = el('g'); const sp = el('g'); const top = el('g'); svg.append(layer, sp, top);
  for (const { c, r, t, s } of hexes) {
    const [x, y] = center(c, r); const g = rng(c, r, 5);
    const fill = s === 'farm' && t !== 'castle' ? 'px-farm' : s === 'market' && t !== 'castle' ? 'px-market' : `px-${t}`;
    layer.append(el('polygon', { points: hexPts(c, r), fill: `url(#${fill})`, stroke: '#00000040', 'stroke-width': 1 }));
    if (t === 'forest') for (const [px, py] of scatter(c, r, 3, 0.45, 3)) sprite(TREE, { g: '#2c6c28', G: '#68c050', t: '#704020' }, px - 9, py - 9, sp);
    if (t === 'mountain') sprite(PEAK, { w: '#f8f8f8', m: '#a89888', d: '#685850' }, x - 13, y - 8, sp);
    if (t === 'hills') for (const [px, py] of scatter(c, r, 2, 0.35, 4)) sprite(HILL, { h: '#c8a060', H: '#e8c888', b: '#987840' }, px - 12, py - 4, sp);
    if (t === 'marsh') for (const [px, py] of scatter(c, r, 4, 0.55, 8)) sprite(REED, { r: '#285838' }, px - 4, py - 4, sp);
    if (t === 'river' || t === 'ford') for (const [px, py] of scatter(c, r, 3, 0.5, 6)) sprite(WAVE, { w: '#d0e8ff' }, px - 6, py - 3, sp);
    if (s === 'market' && t !== 'castle') { sprite(STALL, { R: '#d03828', b: '#704020', x: '#402010' }, x - 15, y - 2, sp); sprite(STALL, { R: '#d86028', b: '#704020', x: '#402010' }, x + 1, y - 9, sp); }
    if (t === 'castle') {
      layer.append(el('polygon', { points: hexPts(c, r, 0.8), fill: '#c8b898', stroke: '#584830', 'stroke-width': 3 }));
      sprite(KEEP, { R: '#c83020', w: '#e8e0d0', d: '#403020' }, x - 12, y - 10, sp);
    }
  }
  for (const u of field.units) {
    const [x, y] = center(u.c, u.r); const col = u.side === 'att' ? ['#2850c8', '#102878', '#90b0ff'] : ['#c83828', '#701810', '#ffa090'];
    top.append(el('rect', { x: x - 15, y: y - 15, width: 30, height: 30, fill: col[1] }));
    top.append(el('rect', { x: x - 12, y: y - 12, width: 24, height: 24, fill: col[0] }));
    top.append(el('rect', { x: x - 12, y: y - 12, width: 24, height: 3, fill: col[2] }));
    const tx = el('text', { x, y: y + 7, 'text-anchor': 'middle', 'font-size': 17, fill: '#fff', 'font-family': 'monospace', 'font-weight': 'bold' }); tx.textContent = { cav: '♞', inf: '⚔', arc: '➶' }[u.type]; top.append(tx);
    if (u.cmd) top.append(el('rect', { x: x + 9, y: y - 21, width: 9, height: 9, fill: '#f0c040', stroke: '#806010' }));
  }
}
